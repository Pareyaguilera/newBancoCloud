<div style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e272e; min-height: 100vh; padding: 30px; color: white;">
  
  <!-- Encabezado Principal -->
  <div style="display: flex; justify-content: space-between; align-items: center; background-color: #2c3e50; padding: 20px 30px; border-radius: 10px; margin-bottom: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
    <h2 style="margin: 0; color: #f1c40f; display: flex; align-items: center; gap: 10px;">
      ⚙️ RabbitMQ - Consola de Administración
    </h2>
    <button routerLink="/admin/dashboard" style="background-color: #7f8c8d; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s;">
      Volver al Dashboard
    </button>
  </div>

  <div style="display: flex; gap: 25px; margin-bottom: 25px; align-items: stretch;">
    
    <!-- Panel 1: Gestión de Mensajes -->
    <div style="background: #2c3e50; padding: 25px; border-radius: 10px; flex: 1; box-shadow: 0 4px 6px rgba(0,0,0,0.2); display: flex; flex-direction: column;">
      <h3 style="margin-top: 0; color: #ecf0f1; border-bottom: 2px solid #34495e; padding-bottom: 10px;">1. Gestión de Mensajes</h3>
      <p style="font-size: 14px; color: #bdc3c7; margin-bottom: 20px;">Extrae el siguiente mensaje de la cola principal y envía el <strong>ACK manual</strong> al servidor.</p>
      
      <!-- El botón se empuja al fondo si hay más espacio gracias al auto margin -->
      <div style="margin-top: auto;">
        <button (click)="ejecutarAckManual()" [disabled]="procesando"
          style="background-color: #e67e22; color: white; border: none; padding: 12px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; font-size: 15px;">
          {{ procesando ? '⏳ Procesando...' : '📥 Extraer Mensaje (ACK Manual)' }}
        </button>
      </div>
    </div>

    <!-- Panel 2: Gestión de Infraestructura -->
    <div style="background: #2c3e50; padding: 25px; border-radius: 10px; flex: 1; box-shadow: 0 4px 6px rgba(0,0,0,0.2);">
      <h3 style="margin-top: 0; color: #ecf0f1; border-bottom: 2px solid #34495e; padding-bottom: 10px;">2. Gestión de Infraestructura</h3>
      
      <!-- Sección Colas -->
      <div style="margin-bottom: 20px;">
        <label style="display:block; font-size: 12px; color: #f39c12; font-weight: bold; margin-bottom: 8px; letter-spacing: 1px;">COLAS</label>
        <div style="display: flex; gap: 10px;">
          <input type="text" [(ngModel)]="nombreColaInput" placeholder="Ej: test.queue" 
            style="flex: 2; padding: 10px; border-radius: 6px; border: 1px solid #455a64; background: #1e272e; color: white; outline: none;">
          <button (click)="crearCola()" style="flex: 1; background-color: #27ae60; color: white; border: none; font-weight: bold; border-radius: 6px; cursor: pointer;">Crear</button>
          <button (click)="eliminarCola()" style="flex: 1; background-color: #c0392b; color: white; border: none; font-weight: bold; border-radius: 6px; cursor: pointer;">Eliminar</button>
        </div>
      </div>

      <!-- Sección Exchanges -->
      <div style="margin-bottom: 20px;">
        <label style="display:block; font-size: 12px; color: #3498db; font-weight: bold; margin-bottom: 8px; letter-spacing: 1px;">EXCHANGES</label>
        <div style="display: flex; gap: 10px;">
          <input type="text" [(ngModel)]="nombreExchangeInput" placeholder="Ej: test.exchange" 
            style="flex: 2; padding: 10px; border-radius: 6px; border: 1px solid #455a64; background: #1e272e; color: white; outline: none;">
          <button (click)="crearExchange()" style="flex: 1; background-color: #2980b9; color: white; border: none; font-weight: bold; border-radius: 6px; cursor: pointer;">Crear Exchange</button>
        </div>
      </div>

      <!-- Sección Bindings -->
      <div>
        <label style="display:block; font-size: 12px; color: #9b59b6; font-weight: bold; margin-bottom: 8px; letter-spacing: 1px;">BINDINGS (VINCULACIÓN)</label>
        <div style="display: flex; gap: 8px; margin-bottom: 10px;">
          <input type="text" [(ngModel)]="bindingColaInput" placeholder="Nombre Cola" style="flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #455a64; background: #1e272e; color: white; outline: none;">
          <input type="text" [(ngModel)]="bindingExchangeInput" placeholder="Nombre Exchange" style="flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #455a64; background: #1e272e; color: white; outline: none;">
          <input type="text" [(ngModel)]="bindingRoutingKeyInput" placeholder="Routing Key" style="flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #455a64; background: #1e272e; color: white; outline: none;">
        </div>
        <button (click)="crearBinding()" style="background-color: #8e44ad; color: white; border: none; padding: 10px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%;">Vincular (Crear Binding)</button>
      </div>
    </div>
  </div>

  <!-- Consola Virtual (Terminal) -->
  <div style="background-color: #0b0c10; border-radius: 8px; padding: 20px; height: 320px; overflow-y: auto; font-family: 'Courier New', Courier, monospace; border: 1px solid #455a64; box-shadow: inset 0 0 10px rgba(0,0,0,0.8);">
    <!-- Texto estético simulando conexión de terminal -->
    <div style="color: #66fcf1; margin-bottom: 15px; border-bottom: 1px dashed #455a64; padding-bottom: 10px;">
      RabbitMQ Admin Shell v1.0<br>
      Status: <span style="color: #2ecc71;">Connected to AMQP</span>
    </div>
    
    <div *ngIf="mensajeConsola.length === 0" style="color: #7f8c8d; font-style: italic;">> Esperando comandos manuales...</div>
    
    <div *ngFor="let msj of mensajeConsola" 
         [ngStyle]="{'color': msj.includes('ÉXITO') || msj.includes('Éxito') ? '#2ecc71' : (msj.includes('ERROR') || msj.includes('Error') ? '#e74c3c' : '#f1c40f')}" 
         style="margin-bottom: 8px; line-height: 1.4;">
      > {{ msj }}
    </div>
  </div>

</div>
